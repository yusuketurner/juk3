name: Deploy Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Assemble supplied HTML and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          cat source/page.b64.1 source/page.b64.2 source/page.b64.3 source/page.b64.4 source/page.b64.5 | base64 -d | gzip -d > index.html
          declare -A src=(
            [il-boy-wave.png]='assets/illustration-learning.svg'
            [il-book-open.png]='assets/illustration-book.svg'
            [photo-hero.jpg]='assets/2oju7nIXRXYMj5EXMi5f2z-mTLPUeyx_sqi3_oCTzv20dyEluY5mAIaZ6GnfXAo4ZkonswZX54teIfTLYsmvnEYU8Tzldk9V6tSHA-HHB3TwSt53IvnfRZjSXMgpoGB90sYSODOHm_RZekqjH7ZH0GI32-0FEk0UFfgl0K0XTwcgPzQKRctrCWikqcsm1CVy.jpeg'
            [il-girl-ruler.png]='assets/illustration-pencil.svg'
            [il-girl-cheer.png]='assets/illustration-learning.svg'
            [photo-01.jpg]='assets/ChatGPT Image 2026年9月10日 21_29_30 (1).png'
            [photo-02.jpg]='assets/ChatGPT Image 2026年9月10日 21_29_31 (2).png'
            [photo-03.jpg]='assets/ChatGPT Image 2026年9月10日 21_31_27.png'
            [photo-04.jpg]='assets/ChatGPT Image 2026年9月10日 22_19_18.png'
            [photo-05.jpg]='assets/ChatGPT Image 2026年9月10日 22_22_24.png'
            [photo-06.jpg]='assets/ChatGPT Image 2026年9月10日 22_25_05.png'
            [il-course-juku.png]='assets/illustration-learning.svg'
            [il-course-soro.png]='assets/illustration-abacus.svg'
            [il-course-eigo.png]='assets/illustration-english.svg'
            [photo-band.jpg]='assets/Gemini_Generated_Image_oov12zoov12zoov1.jpg'
            [il-school.png]='assets/illustration-school.svg'
            [il-book-pencil.png]='assets/illustration-pencil.svg'
            [il-girl-fist.png]='assets/illustration-pencil.svg'
          )
          for name in "${!src[@]}"; do
            url="https://raw.githubusercontent.com/yusuketurner/juk/main/${src[$name]}"
            curl -fsSL --retry 3 "$url" -o "assets/$name"
          done
          test -s index.html
          test "$(grep -oi '<img ' index.html | wc -l)" -eq 20
          for name in "${!src[@]}"; do test -s "assets/$name"; done
          rm -rf source
          touch .nojekyll
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
